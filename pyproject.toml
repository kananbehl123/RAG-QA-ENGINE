[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cost-efficient-rag"
version = "0.1.0"
description = "Cost-Efficient Grounded RAG Application with LanceDB, IR Metrics, and Cost Benchmark"
authors = [{ name = "AI Engineer" }]
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "lancedb>=0.6.0",
    "chromadb>=0.4.24",
    "pyarrow>=14.0.0",
    "openai>=1.12.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.0.0",
    "beautifulsoup4>=4.12.0",
    "numpy>=1.26.0",
    "tabulate>=0.9.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
